name: Build and deploy to Cloud Run

# Runs on every push to main, plus on-demand via the Actions tab (workflow_dispatch)
# for redeploys that don't need a new commit (e.g. after rotating a secret value).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel an in-flight deploy if a newer push lands before it finishes, so we never
# race two deploys for the same service.
concurrency:
  group: deploy-cloudrun
  cancel-in-progress: true

env:
  # GCP_PROJECT_ID is a GitHub repo *variable* (Settings -> Secrets and variables ->
  # Actions -> Variables tab), not a secret -- the project id isn't sensitive and this
  # keeps it out of the workflow file so the same file works if the project is ever
  # renamed. Set it to the value docs/deploy-cloudrun.md section 1 calls $PROJECT_ID.
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  SERVICE_NAME: medhistory
  IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/medhistory/medhistory

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t "${IMAGE}:${GITHUB_SHA}" .

      - name: Push image
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account="medhistory-run@${PROJECT_ID}.iam.gserviceaccount.com" \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            --port=8080 \
            --allow-unauthenticated \
            --set-secrets=ConnectionStrings__Default=ConnectionStrings__Default:latest,Auth__Password=Auth__Password:latest

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)'
